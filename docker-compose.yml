services:
  db:
    image: postgres:16-alpine
    container_name: garage19-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garage19}
      POSTGRES_USER: ${POSTGRES_USER:-garage19}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garage19}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garage19} -d ${POSTGRES_DB:-garage19}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garage19-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-garage19}:${POSTGRES_PASSWORD:-garage19}@db:5432/${POSTGRES_DB:-garage19}?schema=public
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@garage19.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Garage19!Admin}
      CDEK_ACCOUNT: ${CDEK_ACCOUNT:-}
      CDEK_SECURE_PASSWORD: ${CDEK_SECURE_PASSWORD:-}
      CDEK_TEST_MODE: ${CDEK_TEST_MODE:-true}
      BOXBERRY_TOKEN: ${BOXBERRY_TOKEN:-}
      BOXBERRY_TEST_MODE: ${BOXBERRY_TEST_MODE:-true}
      RUSSIAN_POST_LOGIN: ${RUSSIAN_POST_LOGIN:-}
      RUSSIAN_POST_PASSWORD: ${RUSSIAN_POST_PASSWORD:-}
      RUSSIAN_POST_TOKEN: ${RUSSIAN_POST_TOKEN:-}
      DELIVERY_MOCK: ${DELIVERY_MOCK:-true}
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  uploads:
